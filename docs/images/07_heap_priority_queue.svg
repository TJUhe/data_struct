<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Binary heap tree and array mapping</title>
  <desc id="desc">A max heap represented as a complete binary tree and as an array.</desc>
  <rect width="760" height="390" fill="#ffffff"/>
  <text x="46" y="38" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Binary heap: tree shape, array storage</text>
  <g stroke="#475569" stroke-width="3">
    <line x1="225" y1="86" x2="145" y2="150"/>
    <line x1="225" y1="86" x2="305" y2="150"/>
    <line x1="145" y1="190" x2="100" y2="250"/>
    <line x1="145" y1="190" x2="190" y2="250"/>
    <line x1="305" y1="190" x2="260" y2="250"/>
    <line x1="305" y1="190" x2="350" y2="250"/>
  </g>
  <g font-family="Arial" font-size="18" text-anchor="middle" font-weight="700">
    <circle cx="225" cy="80" r="28" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="225" y="87">90</text>
    <circle cx="145" cy="170" r="28" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="145" y="177">70</text>
    <circle cx="305" cy="170" r="28" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="305" y="177">60</text>
    <circle cx="100" cy="270" r="28" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="100" y="277">30</text>
    <circle cx="190" cy="270" r="28" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="190" y="277">20</text>
    <circle cx="260" cy="270" r="28" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="260" y="277">50</text>
    <circle cx="350" cy="270" r="28" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="350" y="277">10</text>
  </g>
  <g transform="translate(450,125)" font-family="Arial" font-size="16" text-anchor="middle">
    <text x="130" y="-28" font-size="18" font-weight="700" fill="#111827">array</text>
    <g fill="#e0f2fe" stroke="#0369a1" stroke-width="2">
      <rect x="0" y="0" width="52" height="44"/><rect x="52" y="0" width="52" height="44"/>
      <rect x="104" y="0" width="52" height="44"/><rect x="156" y="0" width="52" height="44"/>
      <rect x="208" y="0" width="52" height="44"/><rect x="260" y="0" width="52" height="44"/>
      <rect x="312" y="0" width="52" height="44"/>
    </g>
    <text x="26" y="28">90</text><text x="78" y="28">70</text><text x="130" y="28">60</text>
    <text x="182" y="28">30</text><text x="234" y="28">20</text><text x="286" y="28">50</text><text x="338" y="28">10</text>
    <g fill="#64748b" font-size="12">
      <text x="26" y="64">0</text><text x="78" y="64">1</text><text x="130" y="64">2</text>
      <text x="182" y="64">3</text><text x="234" y="64">4</text><text x="286" y="64">5</text><text x="338" y="64">6</text>
    </g>
    <text x="166" y="112" fill="#334155">left(i)=2i+1, right(i)=2i+2</text>
  </g>
</svg>

