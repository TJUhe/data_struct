<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Weighted graph and traversal frontier</title>
  <desc id="desc">A weighted graph with six vertices and edges, suitable for BFS, DFS, and Dijkstra examples.</desc>
  <rect width="760" height="390" fill="#ffffff"/>
  <text x="46" y="38" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Graph: vertices + edges</text>
  <g stroke="#64748b" stroke-width="3" fill="none" font-family="Arial" font-size="14">
    <line x1="150" y1="115" x2="300" y2="90"/><text x="218" y="90" fill="#334155">7</text>
    <line x1="150" y1="115" x2="310" y2="210"/><text x="218" y="176" fill="#334155">9</text>
    <line x1="150" y1="115" x2="520" y2="250"/><text x="335" y="174" fill="#334155">14</text>
    <line x1="300" y1="90" x2="310" y2="210"/><text x="318" y="150" fill="#334155">10</text>
    <line x1="300" y1="90" x2="480" y2="100"/><text x="390" y="82" fill="#334155">15</text>
    <line x1="310" y1="210" x2="480" y2="100"/><text x="392" y="166" fill="#334155">11</text>
    <line x1="310" y1="210" x2="520" y2="250"/><text x="415" y="214" fill="#334155">2</text>
    <line x1="480" y1="100" x2="610" y2="210"/><text x="553" y="148" fill="#334155">6</text>
    <line x1="610" y1="210" x2="520" y2="250"/><text x="570" y="248" fill="#334155">9</text>
  </g>
  <g font-family="Arial" font-size="18" font-weight="700" text-anchor="middle">
    <circle cx="150" cy="115" r="28" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="150" y="122">0</text>
    <circle cx="300" cy="90" r="28" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="300" y="97">1</text>
    <circle cx="310" cy="210" r="28" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="310" y="217">2</text>
    <circle cx="480" cy="100" r="28" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="480" y="107">3</text>
    <circle cx="610" cy="210" r="28" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="610" y="217">4</text>
    <circle cx="520" cy="250" r="28" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="520" y="257">5</text>
  </g>
  <text x="46" y="338" font-family="Arial" font-size="16" fill="#334155">BFS explores by layers; Dijkstra chooses the smallest tentative distance.</text>
</svg>

