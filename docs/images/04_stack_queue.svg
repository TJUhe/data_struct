<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Stack and queue access rules</title>
  <desc id="desc">Stack is last in first out, queue is first in first out.</desc>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="46" y="38" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Stack vs Queue</text>
  <g transform="translate(80,82)" font-family="Arial">
    <text x="80" y="0" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">Stack: LIFO</text>
    <rect x="30" y="38" width="100" height="42" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="30" y="80" width="100" height="42" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="30" y="122" width="100" height="42" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="80" y="65" font-size="15" text-anchor="middle">top C</text>
    <text x="80" y="107" font-size="15" text-anchor="middle">B</text>
    <text x="80" y="149" font-size="15" text-anchor="middle">A</text>
    <path d="M160 58 L230 58" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="195" y="45" font-size="14" text-anchor="middle" fill="#334155">pop</text>
  </g>
  <g transform="translate(390,104)" font-family="Arial">
    <text x="160" y="-22" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">Queue: FIFO</text>
    <path d="M0 64 L42 64" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="21" y="49" font-size="14" text-anchor="middle" fill="#334155">in</text>
    <rect x="50" y="40" width="70" height="48" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <rect x="120" y="40" width="70" height="48" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <rect x="190" y="40" width="70" height="48" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="85" y="70" font-size="15" text-anchor="middle">C</text>
    <text x="155" y="70" font-size="15" text-anchor="middle">B</text>
    <text x="225" y="70" font-size="15" text-anchor="middle">A</text>
    <path d="M260 64 L322 64" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="291" y="49" font-size="14" text-anchor="middle" fill="#334155">out</text>
  </g>
  <text x="46" y="300" font-family="Arial" font-size="16" fill="#334155">限制访问方式，能让算法表达更清楚：括号匹配用栈，BFS 用队列。</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>

