<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">LRU cache map plus list</title>
  <desc id="desc">An LRU cache combines a hash map for lookup and a doubly linked list for recency order.</desc>
  <rect width="760" height="390" fill="#ffffff"/>
  <text x="46" y="38" font-family="Arial" font-size="20" font-weight="700" fill="#111827">LRU cache = hash map + linked list</text>
  <g font-family="Arial" font-size="15">
    <text x="78" y="90" font-size="17" font-weight="700" fill="#111827">unordered_map</text>
    <rect x="70" y="112" width="150" height="42" fill="#e2e8f0" stroke="#475569"/><text x="145" y="139" text-anchor="middle">key 1 -> node</text>
    <rect x="70" y="164" width="150" height="42" fill="#e2e8f0" stroke="#475569"/><text x="145" y="191" text-anchor="middle">key 3 -> node</text>
    <rect x="70" y="216" width="150" height="42" fill="#e2e8f0" stroke="#475569"/><text x="145" y="243" text-anchor="middle">key 4 -> node</text>
    <text x="420" y="90" font-size="17" font-weight="700" fill="#111827">list: most recent to oldest</text>
    <g transform="translate(335,130)">
      <rect x="0" y="0" width="92" height="52" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="46" y="32" text-anchor="middle">4 graph</text>
      <rect x="142" y="0" width="92" height="52" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="188" y="32" text-anchor="middle">1 array</text>
      <rect x="284" y="0" width="92" height="52" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="330" y="32" text-anchor="middle">3 tree</text>
      <path d="M94 26 L136 26" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M236 26 L278 26" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    </g>
    <path d="M220 133 C260 100 305 112 335 143" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M220 185 C270 178 300 164 335 156" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M220 237 C274 250 312 206 335 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <text x="46" y="332" font-family="Arial" font-size="16" fill="#334155">Map finds a node in O(1); list moves that node to the front in O(1).</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>

