<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">Reverse a linked list with three pointers</title>
  <desc id="desc">The prev, cur, and next pointers reverse one link at a time without losing the rest of the list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="860" height="430" fill="url(#bg)"/>
  <rect x="34" y="28" width="792" height="374" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="70" y="72" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Reverse: save next before rewiring</text>
  <g transform="translate(92,135)" font-family="Arial" text-anchor="middle">
    <rect x="0" y="40" width="94" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="47" y="74">10</text>
    <rect x="170" y="40" width="94" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="217" y="74">20</text>
    <rect x="340" y="40" width="94" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="387" y="74">30</text>
    <path d="M94 68 L164 68" stroke="#475569" stroke-width="3" marker-end="url(#arrowSlate)"/>
    <path d="M264 68 L334 68" stroke="#475569" stroke-width="3" marker-end="url(#arrowSlate)"/>
    <path d="M217 38 L217 8" stroke="#15803d" stroke-width="3" marker-end="url(#arrowSlate)"/><text x="217" y="-2" fill="#15803d" font-weight="700">cur</text>
    <path d="M47 104 L47 140" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrowSlate)"/><text x="47" y="162" fill="#1d4ed8" font-weight="700">prev</text>
    <path d="M387 38 L387 8" stroke="#b45309" stroke-width="3" marker-end="url(#arrowSlate)"/><text x="387" y="-2" fill="#b45309" font-weight="700">next</text>
    <path d="M170 98 C128 132 102 132 72 98" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
    <text x="226" y="145" fill="#dc2626" font-size="15">cur->next = prev</text>
  </g>
  <g transform="translate(610,130)" font-family="Arial">
    <rect x="0" y="0" width="150" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="34" font-size="17" font-weight="700" fill="#0f172a">loop order</text>
    <text x="18" y="66" font-size="14" fill="#475569">1. next = cur->next</text>
    <text x="18" y="96" font-size="14" fill="#475569">2. cur->next = prev</text>
    <text x="18" y="126" font-size="14" fill="#475569">3. prev = cur</text>
    <text x="18" y="156" font-size="14" fill="#475569">4. cur = next</text>
  </g>
</svg>

