<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">Circular queue ring buffer</title>
  <desc id="desc">Head and tail wrap around a fixed array, avoiding element movement during enqueue and dequeue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
  </defs>
  <rect width="860" height="430" fill="url(#bg)"/>
  <rect x="34" y="28" width="792" height="374" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="70" y="72" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Circular queue: head and tail wrap around</text>
  <g transform="translate(260,210)" font-family="Arial" text-anchor="middle">
    <circle cx="0" cy="-95" r="38" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/><text y="-89">0</text>
    <circle cx="82" cy="-58" r="38" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="82" y="-52">1</text>
    <circle cx="100" cy="31" r="38" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="100" y="37">2:A</text>
    <circle cx="38" cy="98" r="38" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="38" y="104">3:B</text>
    <circle cx="-55" cy="82" r="38" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="-55" y="88">4:C</text>
    <circle cx="-105" cy="0" r="38" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="-105" y="6">5:D</text>
    <path d="M-148 -52 C-170 -128 -85 -175 -18 -142" stroke="#ea580c" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="-154" y="-130" fill="#ea580c" font-weight="700">wrap</text>
    <text x="116" y="95" fill="#15803d" font-weight="700">head</text>
    <text x="-164" y="20" fill="#0369a1" font-weight="700">tail</text>
  </g>
  <g transform="translate(555,142)" font-family="Arial">
    <rect x="0" y="0" width="205" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="34" font-size="17" font-weight="700" fill="#0f172a">Why it helps</text>
    <text x="18" y="66" font-size="14" fill="#475569">pop: move head only</text>
    <text x="18" y="96" font-size="14" fill="#475569">push: write at tail</text>
    <text x="18" y="126" font-size="14" fill="#475569">no shifting elements</text>
  </g>
</svg>

