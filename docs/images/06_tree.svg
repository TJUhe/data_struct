<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">Binary search tree</title>
  <desc id="desc">A binary search tree where left child values are smaller and right child values are larger.</desc>
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="46" y="38" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Binary search tree</text>
  <g stroke="#475569" stroke-width="3">
    <line x1="380" y1="86" x2="250" y2="150"/>
    <line x1="380" y1="86" x2="510" y2="150"/>
    <line x1="250" y1="190" x2="165" y2="254"/>
    <line x1="250" y1="190" x2="335" y2="254"/>
    <line x1="510" y1="190" x2="595" y2="254"/>
  </g>
  <g font-family="Arial" font-size="18" text-anchor="middle" font-weight="700">
    <circle cx="380" cy="80" r="30" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="380" y="87">8</text>
    <circle cx="250" cy="170" r="30" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="250" y="177">3</text>
    <circle cx="510" cy="170" r="30" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="510" y="177">10</text>
    <circle cx="165" cy="275" r="30" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="165" y="282">1</text>
    <circle cx="335" cy="275" r="30" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="335" y="282">6</text>
    <circle cx="595" cy="275" r="30" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="595" y="282">14</text>
  </g>
  <text x="132" y="332" font-family="Arial" font-size="16" fill="#15803d">left subtree: smaller</text>
  <text x="482" y="332" font-family="Arial" font-size="16" fill="#b45309">right subtree: larger</text>
</svg>

