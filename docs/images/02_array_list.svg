<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic array capacity growth</title>
  <desc id="desc">A dynamic array grows by allocating a larger contiguous block and moving existing values.</desc>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="48" y="36" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Dynamic array: size vs capacity</text>
  <text x="48" y="78" font-family="Arial" font-size="16" fill="#334155">size = used cells, capacity = reserved cells</text>
  <g transform="translate(48,105)">
    <text x="0" y="26" font-family="Arial" font-size="15" fill="#111827">before push</text>
    <g transform="translate(120,0)">
      <rect x="0" y="0" width="62" height="46" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
      <rect x="62" y="0" width="62" height="46" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
      <rect x="124" y="0" width="62" height="46" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
      <rect x="186" y="0" width="62" height="46" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
      <text x="31" y="29" font-family="Arial" font-size="16" text-anchor="middle">A</text>
      <text x="93" y="29" font-family="Arial" font-size="16" text-anchor="middle">B</text>
      <text x="155" y="29" font-family="Arial" font-size="16" text-anchor="middle">C</text>
      <text x="217" y="29" font-family="Arial" font-size="16" text-anchor="middle">D</text>
    </g>
  </g>
  <path d="M360 180 C390 150 430 150 460 180" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(48,220)">
    <text x="0" y="26" font-family="Arial" font-size="15" fill="#111827">after grow</text>
    <g transform="translate(120,0)">
      <rect x="0" y="0" width="62" height="46" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
      <rect x="62" y="0" width="62" height="46" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
      <rect x="124" y="0" width="62" height="46" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
      <rect x="186" y="0" width="62" height="46" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
      <rect x="248" y="0" width="62" height="46" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
      <rect x="310" y="0" width="62" height="46" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <rect x="372" y="0" width="62" height="46" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <rect x="434" y="0" width="62" height="46" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <text x="31" y="29" font-family="Arial" font-size="16" text-anchor="middle">A</text>
      <text x="93" y="29" font-family="Arial" font-size="16" text-anchor="middle">B</text>
      <text x="155" y="29" font-family="Arial" font-size="16" text-anchor="middle">C</text>
      <text x="217" y="29" font-family="Arial" font-size="16" text-anchor="middle">D</text>
      <text x="279" y="29" font-family="Arial" font-size="16" text-anchor="middle">E</text>
    </g>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>

