<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="title desc">
  <title id="title">Nested loops form a triangular amount of work</title>
  <desc id="desc">The outer loop i and inner loop j create a triangular grid of pair checks, explaining O n squared growth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="860" height="420" fill="url(#bg)"/>
  <rect x="36" y="30" width="788" height="360" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="72" y="75" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Nested loop work map</text>
  <text x="72" y="106" font-family="Arial" font-size="15" fill="#475569">Each blue square is one pair check. Only the upper triangle is visited.</text>
  <g transform="translate(92,140)">
    <text x="-18" y="-10" font-family="Arial" font-size="13" fill="#64748b">i</text>
    <text x="285" y="255" font-family="Arial" font-size="13" fill="#64748b">j</text>
    <g stroke="#e2e8f0" fill="#f8fafc">
      <rect x="0" y="0" width="240" height="240"/>
    </g>
    <g fill="url(#cell)">
      <rect x="30" y="0" width="28" height="28" rx="4"/><rect x="60" y="0" width="28" height="28" rx="4"/><rect x="90" y="0" width="28" height="28" rx="4"/><rect x="120" y="0" width="28" height="28" rx="4"/><rect x="150" y="0" width="28" height="28" rx="4"/><rect x="180" y="0" width="28" height="28" rx="4"/><rect x="210" y="0" width="28" height="28" rx="4"/>
      <rect x="60" y="30" width="28" height="28" rx="4"/><rect x="90" y="30" width="28" height="28" rx="4"/><rect x="120" y="30" width="28" height="28" rx="4"/><rect x="150" y="30" width="28" height="28" rx="4"/><rect x="180" y="30" width="28" height="28" rx="4"/><rect x="210" y="30" width="28" height="28" rx="4"/>
      <rect x="90" y="60" width="28" height="28" rx="4"/><rect x="120" y="60" width="28" height="28" rx="4"/><rect x="150" y="60" width="28" height="28" rx="4"/><rect x="180" y="60" width="28" height="28" rx="4"/><rect x="210" y="60" width="28" height="28" rx="4"/>
      <rect x="120" y="90" width="28" height="28" rx="4"/><rect x="150" y="90" width="28" height="28" rx="4"/><rect x="180" y="90" width="28" height="28" rx="4"/><rect x="210" y="90" width="28" height="28" rx="4"/>
      <rect x="150" y="120" width="28" height="28" rx="4"/><rect x="180" y="120" width="28" height="28" rx="4"/><rect x="210" y="120" width="28" height="28" rx="4"/>
      <rect x="180" y="150" width="28" height="28" rx="4"/><rect x="210" y="150" width="28" height="28" rx="4"/>
      <rect x="210" y="180" width="28" height="28" rx="4"/>
    </g>
    <g font-family="Arial" font-size="12" fill="#64748b">
      <text x="9" y="-8">0</text><text x="39" y="-8">1</text><text x="69" y="-8">2</text><text x="99" y="-8">3</text><text x="129" y="-8">4</text><text x="159" y="-8">5</text><text x="189" y="-8">6</text><text x="219" y="-8">7</text>
      <text x="-18" y="19">0</text><text x="-18" y="49">1</text><text x="-18" y="79">2</text><text x="-18" y="109">3</text><text x="-18" y="139">4</text><text x="-18" y="169">5</text><text x="-18" y="199">6</text><text x="-18" y="229">7</text>
    </g>
  </g>
  <g transform="translate(430,145)" font-family="Arial">
    <rect x="0" y="0" width="320" height="88" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="22" y="32" font-size="18" font-weight="700" fill="#1e3a8a">pair count</text>
    <text x="22" y="64" font-size="22" fill="#1d4ed8">n(n - 1) / 2</text>
    <rect x="0" y="116" width="320" height="88" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="22" y="148" font-size="18" font-weight="700" fill="#14532d">after dropping constants</text>
    <text x="22" y="180" font-size="22" fill="#15803d">O(n²)</text>
  </g>
</svg>

