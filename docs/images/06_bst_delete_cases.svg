<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="title desc">
  <title id="title">Binary search tree deletion cases</title>
  <desc id="desc">Deleting a leaf, a node with one child, and a node with two children in a binary search tree.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="860" height="440" fill="url(#bg)"/>
  <rect x="34" y="28" width="792" height="384" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="70" y="72" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">BST erase has three cases</text>
  <g font-family="Arial" text-anchor="middle" font-size="15">
    <g transform="translate(92,120)">
      <text x="90" y="-18" font-size="17" font-weight="700" fill="#0f172a">1. leaf</text>
      <line x1="90" y1="42" x2="45" y2="96" stroke="#64748b" stroke-width="3"/>
      <line x1="90" y1="42" x2="135" y2="96" stroke="#64748b" stroke-width="3"/>
      <circle cx="90" cy="35" r="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="90" y="41">8</text>
      <circle cx="45" cy="108" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="45" y="114">3</text>
      <circle cx="135" cy="108" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="135" y="114">10</text>
      <text x="90" y="174" fill="#475569">remove directly</text>
    </g>
    <g transform="translate(330,120)">
      <text x="90" y="-18" font-size="17" font-weight="700" fill="#0f172a">2. one child</text>
      <line x1="90" y1="42" x2="90" y2="96" stroke="#64748b" stroke-width="3"/>
      <circle cx="90" cy="35" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="90" y="41">10</text>
      <circle cx="90" cy="108" r="26" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="90" y="114">14</text>
      <path d="M143 68 C182 70 184 102 123 108" fill="none" stroke="#16a34a" stroke-width="3"/>
      <text x="90" y="174" fill="#475569">child replaces node</text>
    </g>
    <g transform="translate(585,120)">
      <text x="90" y="-18" font-size="17" font-weight="700" fill="#0f172a">3. two children</text>
      <line x1="90" y1="42" x2="45" y2="96" stroke="#64748b" stroke-width="3"/>
      <line x1="90" y1="42" x2="145" y2="96" stroke="#64748b" stroke-width="3"/>
      <line x1="145" y1="125" x2="120" y2="170" stroke="#64748b" stroke-width="3"/>
      <circle cx="90" cy="35" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="90" y="41">8</text>
      <circle cx="45" cy="108" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="45" y="114">3</text>
      <circle cx="145" cy="108" r="26" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="145" y="114">14</text>
      <circle cx="120" cy="182" r="26" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/><text x="120" y="188">10</text>
      <text x="90" y="238" fill="#475569">replace by successor</text>
    </g>
  </g>
  <text x="70" y="366" font-family="Arial" font-size="16" fill="#475569">The successor is the smallest value in the right subtree. It preserves BST ordering.</text>
</svg>

